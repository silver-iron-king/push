<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: sans-serif;
      background-color: #ffe4ec;
      color: #5b4a55;
    }
    .card {
      margin: 16px;
      padding: 32px 40px;
      border-radius: 24px;
      background-color: white;
      box-shadow: 0 8px 24px rgba(226, 115, 150, 0.15);
    }
    .card p {
      margin: 0 0 24px;
    }
    .button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #f7a8c4;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-size: 16px;
    }
    .button:hover {
      background-color: #f28bb0;
    }
    .button:active {
      background-color: #c3aed6;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <p>연락처: example@email.com</p>
    <div class="buttons">
      <a class="button" href="index.html">메인으로 돌아가기</a>
      <a class="button" href="projects.html">projects 페이지로 가기</a>
    </div>
  </main>
</body>
</html>
