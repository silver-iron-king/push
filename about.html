<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: sans-serif;
      background-color: #ffe4ec;
      color: #5b4a55;
    }
    h1, h2 {
      font-family: 'Jua', sans-serif;
      font-weight: normal;
      color: #e27396;
    }
    .button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #f7a8c4;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-size: 16px;
    }
    .button:hover {
      background-color: #f28bb0;
    }
    .button:active {
      background-color: #c3aed6;
    }
    .profile-image {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      object-position: 66% center;
      margin-bottom: 16px;
      border: 6px solid white;
    }
    .profile {
      margin: 8px 16px 32px;
      padding: 24px 32px;
      border-radius: 24px;
      background-color: white;
      box-shadow: 0 8px 24px rgba(226, 115, 150, 0.15);
      min-width: 260px;
    }
    .profile h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    .profile p {
      margin: 0 0 20px;
    }
    .profile ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .profile li {
      margin: 4px 0;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
  </style>
</head>
<body>
  <h1>이 곳은 About 페이지입니다</h1>
  <img class="profile-image" src="profile.jpg" alt="프로필 사진">
  <section class="profile">
    <h2>이름</h2>
    <p>홍길동</p>
    <h2>관심 분야</h2>
    <ul>
      <li>웹디자인</li>
      <li>일러스트</li>
      <li>영상</li>
    </ul>
  </section>
  <div class="buttons">
    <a class="button" href="index.html">메인으로 돌아가기</a>
    <a class="button" href="projects.html">projects 페이지로 가기</a>
    <a class="button" href="contact.html">contact 페이지로 가기</a>
  </div>
</body>
</html>
