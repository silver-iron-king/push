<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: sans-serif;
    }
    .button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
    }
    .button:hover {
      background-color: #2563eb;
    }
    .button:active {
      background-color: #ef4444;
    }
    .profile {
      margin: 8px 0 32px;
      padding: 24px 32px;
      border-radius: 12px;
      background-color: #f3f4f6;
      min-width: 260px;
    }
    .profile h2 {
      margin: 0 0 8px;
      font-size: 18px;
      color: #3b82f6;
    }
    .profile p {
      margin: 0 0 20px;
    }
    .profile ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .profile li {
      margin: 4px 0;
    }
    .buttons {
      display: flex;
      gap: 12px;
    }
  </style>
</head>
<body>
  <h1>이 곳은 About 페이지입니다</h1>
  <section class="profile">
    <h2>이름</h2>
    <p>홍길동</p>
    <h2>관심 분야</h2>
    <ul>
      <li>웹디자인</li>
      <li>일러스트</li>
      <li>영상</li>
    </ul>
  </section>
  <div class="buttons">
    <a class="button" href="index.html">메인으로 돌아가기</a>
    <a class="button" href="contact.html">contact 페이지로 가기</a>
  </div>
</body>
</html>
