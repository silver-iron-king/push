<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: sans-serif;
      background-color: #ffe4ec;
      color: #5b4a55;
    }
    h1, h2 {
      font-family: 'Jua', sans-serif;
      font-weight: normal;
      color: #e27396;
    }
    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 8px 16px 32px;
    }
    .card {
      width: 220px;
      padding: 28px 24px;
      border-radius: 24px;
      background-color: white;
      box-shadow: 0 8px 24px rgba(226, 115, 150, 0.15);
    }
    .image-placeholder {
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
      border-radius: 12px;
      background-color: #d9d9d9;
      color: #8a8a8a;
      font-size: 14px;
    }
    .card h2 {
      margin: 8px 0;
      font-size: 22px;
    }
    .card p {
      margin: 0;
      line-height: 1.6;
    }
    .button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #f7a8c4;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-size: 16px;
    }
    .button:hover {
      background-color: #f28bb0;
    }
    .button:active {
      background-color: #c3aed6;
    }
  </style>
</head>
<body>
  <h1>나의 프로젝트</h1>
  <div class="cards">
    <section class="card">
      <div class="image-placeholder">이미지</div>
      <h2>브랜드 로고 디자인</h2>
      <p>동네 카페 로고를<br>만들어보고 싶어요</p>
    </section>
    <section class="card">
      <div class="image-placeholder">이미지</div>
      <h2>포스터 디자인</h2>
      <p>좋아하는 영화 포스터<br>다시 그리기</p>
    </section>
    <section class="card">
      <div class="image-placeholder">이미지</div>
      <h2>웹사이트</h2>
      <p>지금 만들고 있는<br>사이트</p>
    </section>
  </div>
  <a class="button" href="index.html">메인으로 돌아가기</a>
</body>
</html>
